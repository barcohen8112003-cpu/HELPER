<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>HELPER</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  /* The avatar: CSS only. No pictures, no fonts, nothing from outside, no face.
     Three looks, chosen by one attribute on <body>: data-design="orb" (default) | "chip" | "figure".
     The same states in all three: idle, dance, react (wave / work / done / listen / think / speak) and alert,
     told apart by motion, colour and light. The parts: .core .ring .dot .mark .limb, each look uses what it needs. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { display: flex; align-items: flex-end; justify-content: center; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; }
  .stage { position: relative; width: 120px; height: 150px; margin-bottom: 6px; }
  .avatar {
    --accent: #8EA2FF; --glow: 0.35; --speed: 1;
    position: absolute; left: 50%; bottom: 14px; width: 100px; height: 110px; margin-left: -50px; cursor: grab;
    transform-origin: 50% 100%;
  }
  .avatar:active { cursor: grabbing; }
  .avatar > div, .amp > div { position: absolute; box-sizing: border-box; }
  .amp { left: 0; top: 0; width: 100%; height: 100%; transform-origin: 50% 100%; transition: transform 90ms ease-out; }
  .glow { display: none; }
  .shadow { position: absolute; left: 50%; bottom: 6px; width: 56px; height: 8px; margin-left: -28px; border-radius: 50%; background: rgba(0,0,0,0.30); filter: blur(3px); }
  .mark, .limb { display: none; }
  /* The accent line (chip) and light (figure) sit on top of the body; the orb's ring goes behind its sphere. */
  [data-design="chip"] .ring, [data-design="figure"] .ring { z-index: 2; }

  /* Colour per state (all looks). */
  .s-react { --glow: 0.5; }
  .s-dance { --accent: #5EEAD4; --glow: 0.55; }
  .v-wave { --accent: #93C5FD; --glow: 0.5; }
  .v-listen { --accent: #60A5FA; --glow: 0.6; }
  .v-think { --accent: #FBBF24; --glow: 0.45; }
  .v-speak { --accent: #34D399; --glow: 0.6; }
  .v-work { --accent: #F59E0B; --glow: 0.5; }
  .v-done { --accent: #4ADE80; --glow: 0.65; }
  .s-alert { --accent: #FF5A5F; --glow: 0.95; }

  /* ── A. Orb: a sphere with a thin orbital ring ───────────────────────────────────────────── */
  [data-design="orb"] .core {
    left: 22px; top: 30px; width: 56px; height: 56px; border-radius: 50%;
    background:
      radial-gradient(circle at 34% 28%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 32%),
      radial-gradient(circle at 50% 62%, var(--accent) 0%, #232638 72%, #12131c 100%);
    box-shadow: 0 0 calc(30px * var(--glow)) color-mix(in srgb, var(--accent) 70%, transparent), inset 0 -6px 14px rgba(0,0,0,0.45);
    transition: background 0.4s, box-shadow 0.4s;
  }
  [data-design="orb"] .ring {
    left: 6px; top: 14px; width: 88px; height: 88px; border-radius: 50%;
    border: 1.5px solid color-mix(in srgb, var(--accent) 45%, transparent); border-top-color: var(--accent);
    transform: rotateX(72deg); animation: orbit calc(9s / var(--speed)) linear infinite;
  }
  [data-design="orb"] .dot {
    left: 44px; top: 52px; width: 12px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9), var(--accent) 60%, transparent 70%); opacity: 0.55; filter: blur(1px);
  }
  @keyframes orbit { from { transform: rotateX(72deg) rotateZ(0deg); } to { transform: rotateX(72deg) rotateZ(360deg); } }
  [data-design="orb"] .s-idle { animation: float 4s ease-in-out infinite; }
  [data-design="orb"] .s-idle .dot { animation: glow 4s ease-in-out infinite; }
  [data-design="orb"] .s-dance { --speed: 6; animation: bounce 0.6s cubic-bezier(.3,.7,.4,1) infinite; }
  [data-design="orb"] .v-listen .ring { animation: orbit 3s linear infinite, listenRing 1.2s ease-in-out infinite; }
  [data-design="orb"] .v-think { --speed: 2.5; }
  [data-design="orb"] .v-think .dot { animation: glow 1.4s ease-in-out infinite; }
  [data-design="orb"] .v-speak .core { animation: speak 0.42s ease-in-out infinite alternate; }
  [data-design="orb"] .v-work { --speed: 5; }
  [data-design="orb"] .v-work .ring { border-style: dashed; }
  [data-design="orb"] .v-wave { animation: tilt 0.5s ease-in-out 3; }
  [data-design="orb"] .v-done .ring { animation: orbit 1.5s linear infinite, burst 0.9s ease-out 2; }
  [data-design="orb"] .s-alert { --speed: 8; animation: jump 0.55s cubic-bezier(.3,.7,.4,1) infinite; }
  [data-design="orb"] .s-alert .core { animation: alertPulse 0.28s ease-in-out infinite alternate; }

  /* ── B. Chip: a dark frosted rounded square with an "H", a status dot and an accent line ──────────── */
  [data-design="chip"] .core {
    left: 20px; top: 26px; width: 60px; height: 60px; border-radius: 16px;
    background: linear-gradient(160deg, rgba(44,47,66,0.92), rgba(16,17,26,0.94));
    border: 1px solid rgba(255,255,255,0.13);
    box-shadow: 0 10px 24px rgba(0,0,0,0.45), 0 0 calc(26px * var(--glow)) color-mix(in srgb, var(--accent) 55%, transparent);
    transition: box-shadow 0.4s;
  }
  [data-design="chip"] .mark { display: block; left: 20px; top: 26px; width: 60px; height: 56px; text-align: center; line-height: 56px; color: #EEF0F8; font-size: 27px; font-weight: 600; letter-spacing: 0.5px; }
  [data-design="chip"] .mark::before { content: "H"; }
  [data-design="chip"] .dot { left: 68px; top: 32px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  [data-design="chip"] .ring { left: 36px; top: 74px; width: 28px; height: 3px; border-radius: 2px; background: var(--accent); opacity: 0.85; transform-origin: 50% 50%; }
  [data-design="chip"] .s-idle { animation: float 5s ease-in-out infinite; }
  [data-design="chip"] .s-idle .dot { animation: glow 3s ease-in-out infinite; }
  [data-design="chip"] .s-dance { animation: chipDance 0.7s ease-in-out infinite; }
  [data-design="chip"] .s-dance .ring { animation: eq 0.35s ease-in-out infinite alternate; }
  [data-design="chip"] .v-listen .dot { animation: ping 1s ease-out infinite; }
  [data-design="chip"] .v-think .ring { animation: scan 1.1s ease-in-out infinite alternate; }
  [data-design="chip"] .v-speak .ring { animation: eq 0.22s ease-in-out infinite alternate; }
  [data-design="chip"] .v-work .ring { animation: scan 0.6s linear infinite alternate; }
  [data-design="chip"] .v-work .dot { animation: glow 0.6s ease-in-out infinite; }
  [data-design="chip"] .v-wave { animation: tilt 0.5s ease-in-out 3; }
  [data-design="chip"] .v-done .ring { animation: fill 0.8s ease-out 1 forwards; }
  [data-design="chip"] .s-alert { animation: jump 0.55s cubic-bezier(.3,.7,.4,1) infinite; }
  [data-design="chip"] .s-alert .core { border-color: var(--accent); animation: alertPulse 0.28s ease-in-out infinite alternate; }
  [data-design="chip"] .s-alert .dot { animation: ping 0.5s ease-out infinite; }

  /* ── C. Figure: an abstract capsule silhouette, matte, one accent light, no face ─────────────────── */
  [data-design="figure"] .dot { left: 38px; top: 6px; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #4a4e66, #22243a 70%); box-shadow: inset 0 -3px 6px rgba(0,0,0,0.4); transform-origin: 50% 100%; }
  [data-design="figure"] .core { left: 32px; top: 34px; width: 36px; height: 62px; border-radius: 18px; background: linear-gradient(180deg, #3a3e55, #1d1f2e); box-shadow: inset 0 -6px 12px rgba(0,0,0,0.45); }
  [data-design="figure"] .ring { left: 44px; top: 50px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 calc(22px * var(--glow)) var(--accent), 0 0 4px var(--accent); }
  [data-design="figure"] .limb { display: block; top: 40px; width: 9px; height: 40px; border-radius: 5px; background: linear-gradient(180deg, #34384d, #1d1f2e); transform-origin: 50% 4px; }
  [data-design="figure"] .limb.l { left: 22px; transform: rotate(10deg); }
  [data-design="figure"] .limb.r { left: 69px; transform: rotate(-10deg); }
  [data-design="figure"] .avatar { transform-origin: 50% 100%; }
  [data-design="figure"] .s-idle { animation: breathe 4s ease-in-out infinite; }
  [data-design="figure"] .s-dance { animation: sway 0.8s ease-in-out infinite; }
  [data-design="figure"] .s-dance .limb.l { animation: armUpL 0.4s ease-in-out infinite alternate; }
  [data-design="figure"] .s-dance .limb.r { animation: armUpR 0.4s ease-in-out infinite alternate; }
  [data-design="figure"] .v-listen .dot { transform: rotate(-12deg); }
  [data-design="figure"] .v-listen .ring { animation: glow 1s ease-in-out infinite; }
  [data-design="figure"] .v-think .dot { transform: translateY(2px) rotate(8deg); }
  [data-design="figure"] .v-think .ring { animation: glow 1.6s ease-in-out infinite; }
  [data-design="figure"] .v-speak .ring { animation: speak 0.3s ease-in-out infinite alternate; }
  [data-design="figure"] .v-work .limb.l { animation: workL 0.45s ease-in-out infinite alternate; }
  [data-design="figure"] .v-work .limb.r { animation: workR 0.45s ease-in-out infinite alternate; }
  [data-design="figure"] .v-wave .limb.r { animation: waveArm 0.32s ease-in-out infinite alternate; }
  [data-design="figure"] .v-done .limb.l { transform: rotate(150deg); }
  [data-design="figure"] .v-done .limb.r { transform: rotate(-150deg); }
  [data-design="figure"] .v-done { animation: hop 0.6s ease-out 2; }
  [data-design="figure"] .s-alert { animation: jump 0.55s cubic-bezier(.3,.7,.4,1) infinite; }
  [data-design="figure"] .s-alert .ring { animation: alertPulse 0.28s ease-in-out infinite alternate; }
  [data-design="figure"] .s-alert .limb.l { transform: rotate(160deg); }
  [data-design="figure"] .s-alert .limb.r { transform: rotate(-160deg); }

  /* Shared motion. */
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.025); } }
  @keyframes glow { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  @keyframes bounce { 0%, 100% { transform: translateY(0) scale(1.04, 0.95); } 50% { transform: translateY(-12px) scale(0.98, 1.03); } }
  @keyframes sway { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg) translateY(-4px); } }
  @keyframes tilt { 0%, 100% { transform: rotate(0); } 33% { transform: rotate(-9deg); } 66% { transform: rotate(9deg); } }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-12px); } }
  @keyframes jump { 0%, 100% { transform: translateY(0) scale(1.07, 0.9); } 15% { transform: translateY(0) scale(1); } 50% { transform: translateY(-36px) scale(0.96, 1.05); } }
  @keyframes speak { from { transform: scale(1); } to { transform: scale(1.09); } }
  @keyframes alertPulse { from { filter: brightness(1); } to { filter: brightness(1.6); } }
  @keyframes listenRing { 0%, 100% { border-width: 1.5px; } 50% { border-width: 3px; } }
  @keyframes burst { from { opacity: 1; } to { opacity: 0.2; } }
  @keyframes chipDance { 0%, 100% { transform: rotate(-6deg) translateY(0); } 25% { transform: rotate(0) translateY(-7px); } 50% { transform: rotate(6deg) translateY(0); } 75% { transform: rotate(0) translateY(-7px); } }
  @keyframes eq { from { transform: scaleX(0.4); } to { transform: scaleX(1.35); } }
  @keyframes scan { from { transform: translateX(-9px) scaleX(0.5); } to { transform: translateX(9px) scaleX(0.5); } }
  @keyframes fill { from { transform: scaleX(0.3); } to { transform: scaleX(1.6); } }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 var(--accent); } 100% { box-shadow: 0 0 0 9px transparent; } }
  @keyframes armUpL { from { transform: rotate(150deg); } to { transform: rotate(115deg); } }
  @keyframes armUpR { from { transform: rotate(-115deg); } to { transform: rotate(-150deg); } }
  @keyframes workL { from { transform: rotate(40deg); } to { transform: rotate(70deg); } }
  @keyframes workR { from { transform: rotate(-70deg); } to { transform: rotate(-40deg); } }
  @keyframes waveArm { from { transform: rotate(-125deg); } to { transform: rotate(-165deg); } }

  /* ── Live moves to music on the PC (tray "לזוז לפי הקצב והעוצמה"): only while dancing, only with .live on the stage.
     --energy (0..1) and --beat (one move, in seconds) come from main as numbers; k0/k1/k2 is quiet/medium/loud.
     Only transform and opacity change, so the graphics card does it. Without .live the dance is the same as before. */
  .live .s-dance .glow {
    display: block; left: 10px; top: 18px; width: 80px; height: 80px; border-radius: 50%; z-index: -1;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 60%, transparent) 0%, transparent 68%);
    opacity: calc(0.1 + 0.75 * var(--energy, 0.5)); transition: opacity 120ms linear;
  }
  .amp.beat { transform: translateY(-6px) scale(1.03); }
  [data-design="orb"] .live .s-dance { animation-duration: var(--beat, 0.6s); }
  [data-design="orb"] .live.k0 .s-dance { animation-name: bounceLo; }
  [data-design="orb"] .live.k2 .s-dance { animation-name: bounceHi; }
  [data-design="orb"] .live .s-dance .amp.beat .dot { opacity: 1; }
  [data-design="chip"] .live .s-dance { animation-duration: calc(var(--beat, 0.35s) * 2); }
  [data-design="chip"] .live.k0 .s-dance { animation-name: chipDanceLo; }
  [data-design="chip"] .live.k2 .s-dance { animation-name: chipDanceHi; }
  [data-design="chip"] .live .s-dance .ring { animation: none; transform: scaleX(calc(0.35 + var(--energy, 0.5))); transition: transform 90ms linear; }
  [data-design="chip"] .live .s-dance .amp.beat .dot { box-shadow: 0 0 14px var(--accent); }
  [data-design="figure"] .live .s-dance { animation-duration: calc(var(--beat, 0.4s) * 2); }
  [data-design="figure"] .live.k0 .s-dance { animation-name: swayLo; }
  [data-design="figure"] .live.k2 .s-dance { animation-name: swayHi; }
  [data-design="figure"] .live .s-dance .limb.l, [data-design="figure"] .live .s-dance .limb.r { animation-duration: var(--beat, 0.4s); }
  [data-design="figure"] .live.k0 .s-dance .limb.l { animation-name: armLoL; }
  [data-design="figure"] .live.k0 .s-dance .limb.r { animation-name: armLoR; }
  @keyframes bounceLo { 0%, 100% { transform: translateY(0) scale(1.02, 0.98); } 50% { transform: translateY(-4px) scale(0.99, 1.01); } }
  @keyframes bounceHi { 0%, 100% { transform: translateY(0) scale(1.06, 0.92); } 50% { transform: translateY(-18px) scale(0.97, 1.04); } }
  @keyframes chipDanceLo { 0%, 100% { transform: rotate(-3deg) translateY(0); } 25% { transform: rotate(0) translateY(-3px); } 50% { transform: rotate(3deg) translateY(0); } 75% { transform: rotate(0) translateY(-3px); } }
  @keyframes chipDanceHi { 0%, 100% { transform: rotate(-9deg) translateY(0); } 25% { transform: rotate(0) translateY(-11px); } 50% { transform: rotate(9deg) translateY(0); } 75% { transform: rotate(0) translateY(-11px); } }
  @keyframes swayLo { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) translateY(-2px); } }
  @keyframes swayHi { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg) translateY(-7px); } }
  @keyframes armLoL { from { transform: rotate(40deg); } to { transform: rotate(15deg); } }
  @keyframes armLoR { from { transform: rotate(-15deg); } to { transform: rotate(-40deg); } }

  /* Hidden or off screen: nothing moves (no CPU for an animation nobody sees). */
  .paused, .paused * { animation-play-state: paused !important; }
</style>
</head>
<body data-design="orb">
  <div class="stage" id="stage">
    <div class="avatar s-idle" id="avatar" role="img" aria-label="HELPER">
      <div class="amp" id="amp">
        <div class="glow"></div>
        <div class="limb l"></div><div class="limb r"></div>
        <div class="ring"></div>
        <div class="core"></div>
        <div class="dot"></div>
        <div class="mark"></div>
      </div>
    </div>
    <div class="shadow"></div>
  </div>
<script src="avatar.js"></script>
</body>
</html>
