<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>HELPER</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  /* The avatar: drawn with CSS only, no pictures, fonts or anything from outside. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { display: flex; align-items: flex-end; justify-content: center; font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  .stage { position: relative; width: 120px; height: 150px; margin-bottom: 6px; }
  .avatar { position: absolute; left: 50%; bottom: 10px; width: 84px; height: 96px; margin-left: -42px; cursor: grab; transform-origin: 50% 100%; }
  .avatar:active { cursor: grabbing; }
  .shadow { position: absolute; left: 50%; bottom: 2px; width: 64px; height: 10px; margin-left: -32px; border-radius: 50%; background: rgba(0,0,0,0.28); filter: blur(2px); transform-origin: 50% 50%; }
  .body {
    position: absolute; inset: 14px 6px 0 6px; border-radius: 40px 40px 30px 30px;
    background: radial-gradient(circle at 35% 30%, #A99CFF 0%, #8B7CFF 45%, #5B4BD6 100%);
    border: 1px solid rgba(255,255,255,0.25); box-shadow: 0 8px 22px rgba(0,0,0,0.35), 0 0 18px rgba(139,124,255,0.35);
  }
  .antenna { position: absolute; left: 50%; top: 0; width: 3px; height: 16px; margin-left: -1.5px; background: #C9C1FF; border-radius: 2px; }
  .antenna::after { content: ""; position: absolute; left: -4px; top: -6px; width: 11px; height: 11px; border-radius: 50%; background: #6EE7A8; box-shadow: 0 0 8px #6EE7A8; }
  .face { position: absolute; left: 0; right: 0; top: 30px; height: 30px; }
  .eye { position: absolute; top: 4px; width: 12px; height: 14px; border-radius: 50%; background: #F5F6FA; overflow: hidden; }
  .eye::after { content: ""; position: absolute; left: 3px; top: 4px; width: 6px; height: 7px; border-radius: 50%; background: #1A1830; }
  .eye.l { left: 22px; } .eye.r { right: 22px; }
  .mouth { position: absolute; left: 50%; top: 22px; width: 18px; height: 8px; margin-left: -9px; border-bottom: 3px solid #1A1830; border-radius: 0 0 12px 12px; }
  .arm { position: absolute; top: 52px; width: 10px; height: 30px; border-radius: 6px; background: #7666EE; transform-origin: 50% 4px; }
  .arm.l { left: -2px; transform: rotate(18deg); } .arm.r { right: -2px; transform: rotate(-18deg); }
  .bang { position: absolute; left: 50%; top: -6px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: #FF7A7A; color: #fff; font-weight: 800; font-size: 18px; line-height: 26px; text-align: center; opacity: 0; transform: scale(0.4); }
  .note { position: absolute; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: #6EE7A8; opacity: 0; }
  .note::after { content: ""; position: absolute; right: 0; top: -14px; width: 2px; height: 16px; background: #6EE7A8; }
  .note.a { right: 6px; } .note.b { left: 8px; top: 20px; }

  /* idle: breathing, and a blink now and then */
  .s-idle { animation: breathe 3.2s ease-in-out infinite; }
  .s-idle .eye, .s-dance .eye { animation: blink 5s infinite; }
  @keyframes breathe { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-3px) scaleY(1.02); } }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }

  /* dance: sway and bounce, arms up, little notes */
  .s-dance { animation: sway 0.9s ease-in-out infinite; }
  .s-dance .arm.l { animation: armL 0.45s ease-in-out infinite alternate; }
  .s-dance .arm.r { animation: armR 0.45s ease-in-out infinite alternate; }
  .s-dance .note { animation: float 1.8s ease-out infinite; }
  .s-dance .note.b { animation-delay: 0.9s; }
  .s-dance .mouth { height: 10px; border-radius: 0 0 14px 14px; }
  @keyframes sway { 0%, 100% { transform: rotate(-8deg) translateY(0); } 25% { transform: rotate(0) translateY(-8px); } 50% { transform: rotate(8deg) translateY(0); } 75% { transform: rotate(0) translateY(-8px); } }
  @keyframes armL { from { transform: rotate(150deg); } to { transform: rotate(110deg); } }
  @keyframes armR { from { transform: rotate(-110deg); } to { transform: rotate(-150deg); } }
  @keyframes float { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-34px) rotate(15deg); } }

  /* react: wave (a message), busy (a task started), done (a task ended) */
  .s-react { animation: perk 0.5s ease-out 1; }
  .s-react.v-wave .arm.r { animation: wave 0.35s ease-in-out infinite alternate; }
  .s-react.v-work .eye::after { animation: look 0.8s ease-in-out infinite alternate; }
  .s-react.v-work .antenna::after { background: #FFD27A; box-shadow: 0 0 10px #FFD27A; animation: pulse 0.6s ease-in-out infinite alternate; }
  .s-react.v-done { animation: hop 0.6s ease-out 2; }
  .s-react.v-done .arm.l { transform: rotate(140deg); } .s-react.v-done .arm.r { transform: rotate(-140deg); }
  @keyframes perk { 0% { transform: scale(1); } 40% { transform: scale(1.08, 0.94); } 100% { transform: scale(1); } }
  @keyframes wave { from { transform: rotate(-120deg); } to { transform: rotate(-165deg); } }
  @keyframes look { from { transform: translateX(-2px); } to { transform: translateX(3px); } }
  @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px); } }

  /* alert: big jumps, red glow and "!", for a few seconds only (the app ends it) */
  .s-alert { animation: jump 0.55s cubic-bezier(.3,.7,.4,1) infinite; }
  .s-alert .body { background: radial-gradient(circle at 35% 30%, #FFB0B0 0%, #FF7A7A 45%, #D64B4B 100%); box-shadow: 0 0 26px rgba(255,122,122,0.8); }
  .s-alert .bang { opacity: 1; transform: scale(1); animation: pop 0.55s ease-in-out infinite; }
  .s-alert .arm.l { transform: rotate(160deg); } .s-alert .arm.r { transform: rotate(-160deg); }
  .s-alert .mouth { width: 12px; height: 12px; margin-left: -6px; border: 3px solid #1A1830; border-radius: 50%; }
  .s-alert ~ .shadow { animation: squash 0.55s cubic-bezier(.3,.7,.4,1) infinite; }
  @keyframes jump { 0%, 100% { transform: translateY(0) scale(1.06, 0.92); } 15% { transform: translateY(0) scale(1); } 50% { transform: translateY(-38px) scale(0.96, 1.06); } }
  @keyframes pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
  @keyframes squash { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.6); opacity: 0.5; } }

  /* Hidden or off screen: nothing moves (no CPU for an animation nobody sees). */
  .paused, .paused * { animation-play-state: paused !important; }
</style>
</head>
<body>
  <div class="stage">
    <div class="avatar s-idle" id="avatar" role="img" aria-label="HELPER">
      <div class="body"></div>
      <div class="antenna"></div>
      <div class="face"><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div>
      <div class="arm l"></div><div class="arm r"></div>
      <div class="bang">!</div>
      <div class="note a"></div><div class="note b"></div>
    </div>
    <div class="shadow"></div>
  </div>
<script src="avatar.js"></script>
</body>
</html>
