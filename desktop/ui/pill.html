<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>HELPER</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  .pill {
    display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: 22px;
    background: rgba(14, 16, 25, 0.90);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.12); color: #F5F6FA;
    box-shadow: 0 12px 35px rgba(0,0,0,0.55), 0 0 20px rgba(139, 124, 255, 0.15); font-size: 13.5px; transition: border-color 0.2s;
  }
  .pill.done { border-color: rgba(110, 231, 168, 0.8); }
  .pill.error { border-color: rgba(255, 122, 122, 0.8); }
  canvas { width: 72px; height: 28px; }
  .label { white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="pill" id="pill"><canvas id="w" width="144" height="56"></canvas><span class="label" id="label">מכתיב…</span></div>
<script src="recorder.js"></script>
<script src="pill.js"></script>
</body>
</html>
