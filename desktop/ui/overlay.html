<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  body.pick { cursor: crosshair; background: rgba(10, 12, 20, 0.12); }
  .ring {
    position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
    border: 4px solid #8B7CFF; box-shadow: 0 0 0 4px rgba(139,124,255,0.25), 0 0 24px rgba(139,124,255,0.7);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .label {
    position: absolute; transform: translate(-50%, 0); margin-top: 44px; padding: 6px 12px; border-radius: 12px;
    background: rgba(17,19,26,0.94); color: #F2F3F7; font-size: 15px; font-weight: 600; white-space: nowrap;
    border: 1px solid rgba(139,124,255,0.6); box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .box { position: absolute; border: 3px solid #4FD1FF; border-radius: 10px; background: rgba(79, 209, 255, 0.10); box-shadow: 0 0 18px rgba(79,209,255,0.5); }
  .hint {
    position: absolute; top: 24px; left: 50%; transform: translateX(-50%); padding: 10px 18px; border-radius: 16px;
    background: rgba(17,19,26,0.94); color: #F2F3F7; font-size: 15px; border: 1px solid rgba(255,255,255,0.1);
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
</style>
</head>
<body>
<script src="overlay.js"></script>
</body>
</html>
