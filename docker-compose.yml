# Run Helper 24/7 on a VPS (Oracle Always Free, or any Docker host).
# Usage on the server:
#   docker compose up -d --build
# Logs (pairing code / QR path):
#   docker compose logs -f
services:
  helper:
    build: .
    container_name: helper
    restart: unless-stopped
    env_file: .env
    environment:
      HELPER_DATA_DIR: /var/data
      TIMEZONE: Asia/Jerusalem
      # Computer actions stay off until .env sets COMPUTER_MODE=ask (or auto) and PC_BRIDGE_SECRET.
      # The port is the only thing published: the home PC dials out to it. Nothing at home is exposed.
      PC_BRIDGE_LISTEN: "1"
      PC_BRIDGE_PORT: "3212"
      NODE_ENV: production
    ports:
      - "3212:3212"
    volumes:
      - helper-data:/var/data
    # Chromium inside the image needs these for headless page reads.
    shm_size: "256mb"

volumes:
  helper-data:
