# Builds the HELPER Android app on every change under android/, runs its unit tests, and publishes the signed APK
# at a fixed link the phone can download from directly:
#   https://github.com/<owner>/<repo>/releases/download/android-latest/HELPER.apk
#
# Signing uses one fixed key from the repository's secrets, so each new APK installs over the previous one:
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key and has to be uninstalled before each update.
name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/helper.jks"
            echo "HELPER_KEYSTORE=$RUNNER_TEMP/helper.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK is signed with a throwaway key and will not install over the previous one."
          fi

      - name: Test and build
        env:
          HELPER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HELPER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HELPER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/HELPER.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HELPER-apk
          path: ${{ runner.temp }}/HELPER.apk

      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "HELPER Android (latest)" --notes "Built automatically from main. Download HELPER.apk on the phone and install it." --prerelease
          gh release upload android-latest "$RUNNER_TEMP/HELPER.apk" --clobber
          gh release edit android-latest --notes "Build ${{ github.run_number }} from ${{ github.sha }}. Download HELPER.apk on the phone and install it."

      # The installed app reads this to update itself. It goes up after the APK, so it never points at a file that is
      # not there yet, and only for builds signed with the real key: the app would refuse any other one anyway.
      - name: Tell installed apps about this build
        if: github.ref == 'refs/heads/main' && env.HELPER_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$((100 + ${{ github.run_number }}))
          sum=$(sha256sum "$RUNNER_TEMP/HELPER.apk" | cut -d' ' -f1)
          url="https://github.com/${{ github.repository }}/releases/download/android-latest/HELPER.apk"
          printf '{"versionCode":%d,"versionName":"1.%d","sha256":"%s","url":"%s"}\n' "$code" "${{ github.run_number }}" "$sum" "$url" > "$RUNNER_TEMP/version.json"
          cat "$RUNNER_TEMP/version.json"
          gh release upload android-latest "$RUNNER_TEMP/version.json" --clobber
