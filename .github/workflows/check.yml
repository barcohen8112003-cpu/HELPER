# Runs every offline self-test on each pull request and on main, so a change that breaks Helper is caught before
# it is merged. Merging to main goes live on the server within ten minutes (scripts/auto-update.sh).
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:all
