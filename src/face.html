<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELPER</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #121c22; color: #f4efe6; font: 18px/1.45 system-ui, "Segoe UI", Arial, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100%; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 18px; }
  a { color: #f4efe6; }
  h1 { font: 400 28px/1 Georgia, "Times New Roman", serif; margin: 0; }
  #status { margin-inline-start: auto; color: #b7c4c8; font-size: 15px; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 12px; }
  #stage { position: relative; width: min(92vw, 720px); aspect-ratio: 1; background: #10181d; border-radius: 28px; overflow: hidden; }
  canvas, #frame, video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #10181d; }
  #caption { min-height: 2.6em; max-width: 40rem; text-align: center; padding: 0 12px; }
  button { font: inherit; background: #f4efe6; color: #142028; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; }
  #play { display: none; }
  #play.on { display: inline-block; }
</style>
</head>
<body>
<header>
  <h1>HELPER</h1>
  <a href="/">הגדרות</a>
  <span id="status">מתחבר…</span>
</header>
<main>
  <div id="stage">
    <canvas id="face" width="720" height="720" aria-label="הפנים של HELPER"></canvas>
    <img id="frame" alt="" hidden>
    <video id="live" autoplay playsinline hidden></video>
  </div>
  <p id="caption"></p>
  <button id="play" type="button">נגן</button>
</main>
<script type="module" src="/face/client.js"></script>
</body>
</html>
