<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HELPER פאנל</title>
<style>
:root { color-scheme: light dark; --bg: #faf8f5; --fg: #1d1d1f; --muted: #6b6b70; --card: #ffffff; --line: #e3e0da; --accent: #2f6fde; --bad: #c0392b; }
@media (prefers-color-scheme: dark) { :root { --bg: #151517; --fg: #ececee; --muted: #a0a0a8; --card: #1f1f23; --line: #33333a; --accent: #6f9cf0; --bad: #ef6f61; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
h1 { font-size: 22px; margin: 0 0 4px; }
p.sub { color: var(--muted); margin: 0 0 24px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
label { display: block; font-weight: 600; margin-bottom: 6px; }
input, textarea { width: 100%; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
textarea { min-height: 96px; resize: vertical; }
button { font: inherit; border: 0; border-radius: 8px; padding: 10px 18px; background: var(--accent); color: #fff; cursor: pointer; margin-top: 10px; }
button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
button:disabled { opacity: .6; cursor: default; }
.row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.err { color: var(--bad); min-height: 1.5em; margin-top: 8px; }
#reply { white-space: pre-wrap; word-break: break-word; }
.muted { color: var(--muted); font-size: 14px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>HELPER</h1>
  <p class="sub">פאנל שליטה מרחוק</p>

  <section id="login" class="card">
    <label for="cred">Credential</label>
    <input id="cred" type="password" autocomplete="off" spellcheck="false">
    <button id="go">כניסה</button>
    <div id="loginErr" class="err" role="alert"></div>
  </section>

  <section id="app" hidden>
    <div class="card">
      <label for="text">בקשה</label>
      <textarea id="text"></textarea>
      <div class="row">
        <button id="send">שלח</button>
        <button id="out" class="ghost">יציאה</button>
      </div>
      <div id="askErr" class="err" role="alert"></div>
    </div>
    <div class="card">
      <div id="working" class="muted" hidden>עובד על זה… בקשה עם כלים יכולה לקחת כמה דקות.</div>
      <div id="reply"></div>
    </div>
    <p id="state" class="muted"></p>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id)
  let csrf = ''
  const cookie = (name) => (document.cookie.split('; ').find((c) => c.startsWith(name + '=')) || '').slice(name.length + 1)
  const api = (path, opts = {}) => fetch(path, { credentials: 'same-origin', ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } })
  const show = (signedIn) => { $('login').hidden = signedIn; $('app').hidden = !signedIn }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms))

  async function refresh() {
    try {
      const r = await api('/panel/api/status')
      if (r.status !== 200) return show(false)
      const s = await r.json()
      if (s.csrf) csrf = s.csrf
      show(true)
      $('state').textContent = `תור: ${s.queueBusy ? 'עסוק' : 'פנוי'} · גשר הבית: ${s.pcBridgeConnected ? 'מחובר' : 'לא מחובר'} · ממתין לאישור: ${s.pendingApprovals}`
    } catch { show(false) }
  }

  $('go').onclick = async () => {
    $('loginErr').textContent = ''
    $('go').disabled = true
    try {
      const r = await api('/panel/api/login', { method: 'POST', headers: { 'X-CSRF-Token': cookie('hpn_pre') }, body: JSON.stringify({ credential: $('cred').value.trim() }) })
      const b = await r.json().catch(() => ({}))
      if (r.status !== 200) { $('loginErr').textContent = b.error || 'הכניסה נכשלה'; return }
      csrf = b.csrf
      $('cred').value = ''
      await refresh()
    } finally { $('go').disabled = false }
  }

  $('out').onclick = async () => {
    await api('/panel/api/logout', { method: 'POST', headers: { 'X-CSRF-Token': csrf } }).catch(() => {})
    csrf = ''
    show(false)
  }

  // One id per request. After a dropped connection the page asks for that id again, it never sends the request twice.
  $('send').onclick = async () => {
    const text = $('text').value.trim()
    if (!text) return
    const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/[^A-Za-z0-9_-]/g, '')
    $('askErr').textContent = ''
    $('reply').textContent = ''
    $('working').hidden = false
    $('send').disabled = true
    try {
      let r
      try {
        r = await api('/panel/api/ask', { method: 'POST', headers: { 'X-CSRF-Token': csrf }, body: JSON.stringify({ text, id }) })
      } catch { r = null }
      for (let i = 0; i < 400; i++) {
        if (r && r.status !== 202) break
        await wait(3000)
        try { r = await api('/panel/api/ask/' + id) } catch { r = null }
        if (r && r.status === 404) { await wait(2000); continue }
      }
      const b = r ? await r.json().catch(() => ({})) : {}
      if (!r) $('askErr').textContent = 'אין חיבור. הבקשה לא תישלח שוב לבד.'
      else if (r.status === 200 && b.reply !== undefined) $('reply').textContent = b.reply
      else if (r.status === 200 && b.state === 'unknown') $('askErr').textContent = 'התוצאה לא ידועה. בדוק ביומן הפעילות לפני שאתה שולח שוב.'
      else if (r.status === 202) $('askErr').textContent = b.note || 'עדיין רץ.'
      else $('askErr').textContent = b.error || 'שגיאה'
      if (r && r.status === 403 && /להתחבר/.test(b.error || '')) show(false)
    } finally {
      $('working').hidden = true
      $('send').disabled = false
    }
  }

  refresh()
})()
</script>
</body>
</html>
