<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>התחברות ל-Webtop</title>
<style>
  :root { --bg:#faf8f5; --card:#fff; --ink:#1f1d1a; --muted:#77716a; --line:#e7e2da; --accent:#1f1d1a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui, "Segoe UI", Arial, sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:18px 22px; }
  h1 { font:400 26px/1.2 Georgia, "Times New Roman", serif; margin:0; }
  a { color:var(--ink); }
  .note { color:var(--muted); margin:0 22px 12px; max-width:920px; }
  #status { margin-inline-start:auto; color:var(--muted); font-size:13px; }
  #stage { margin:0 22px 28px; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; outline:none; max-width:1100px; cursor:pointer; }
  #stage:focus { box-shadow:0 0 0 2px var(--accent); }
  img { display:block; width:100%; height:auto; background:#111; }
  .hint { margin:8px 22px 0; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>התחברות ל-Webtop</h1>
  <a href="/">חזרה להגדרות</a>
  <span id="status">מתחבר…</span>
</header>
<p class="note">זה החלון של Webtop שרץ בענן. נכנסים כאן פעם אחת, כולל סיסמה או קוד SMS. הסיסמה לא נשמרת אצל העוזר, רק עוגיות הדפדפן עצמו.</p>
<div id="stage" tabindex="0">
  <img id="view" alt="חלון Webtop">
</div>
<p class="hint">לוחצים על התמונה, מקלידים, וגוללים. Enter, Tab ו-Backspace נשלחים לאתר.</p>
<script>
const stage = document.getElementById('stage')
const img = document.getElementById('view')
const status = document.getElementById('status')
let url = ''
function point(e) {
  const r = img.getBoundingClientRect()
  const sx = img.naturalWidth && r.width ? img.naturalWidth / r.width : 1
  const sy = img.naturalHeight && r.height ? img.naturalHeight / r.height : 1
  return { x: Math.round((e.clientX - r.left) * sx), y: Math.round((e.clientY - r.top) * sy) }
}
async function send(body) {
  const res = await fetch('/api/webtop/input', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  if (!res.ok) {
    const data = await res.json().catch(() => ({}))
    status.textContent = data.error || 'הפעולה נכשלה'
  }
}
async function tick() {
  try {
    const res = await fetch('/api/webtop/frame', { cache: 'no-store' })
    if (!res.ok) {
      const data = await res.json().catch(() => ({}))
      status.textContent = data.error || 'אין תמונה'
      return
    }
    const blob = await res.blob()
    const next = URL.createObjectURL(blob)
    img.onload = () => { if (url) URL.revokeObjectURL(url); url = next }
    img.src = next
    status.textContent = 'החלון פעיל'
  } catch {
    status.textContent = 'התצוגה נקטעה'
  }
}
stage.addEventListener('click', (e) => { stage.focus(); send({ type: 'click', ...point(e) }) })
stage.addEventListener('wheel', (e) => { e.preventDefault(); send({ type: 'scroll', ...point(e), deltaY: e.deltaY }) }, { passive: false })
stage.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === 'Tab' || e.key === 'Backspace') {
    e.preventDefault()
    send({ type: 'key', key: e.key })
    return
  }
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault()
    send({ type: 'type', text: e.key })
  }
})
stage.focus()
tick()
setInterval(tick, 800)
</script>
</body>
</html>
